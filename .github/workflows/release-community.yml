on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (format: vX.Y.Z)"
        required: true
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

name: Release Community

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != '' && github.ref_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      channel: ${{ steps.vars.outputs.channel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
            CHANNEL="stable"
            VERSION="${TAG#v}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag '$TAG'. Expected vX.Y.Z."
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="nightly-${SHORT_SHA}"
            PRERELEASE="true"
            CHANNEL="nightly"
            VERSION="$(sed -n -E 's/^[[:space:]]*\.?version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.zig.zon)"
            if [[ -z "$VERSION" ]]; then
              echo "Unable to read version from build.zig.zon"
              exit 1
            fi
          else
            TAG="${{ github.event.inputs.tag }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            VERSION="${TAG#v}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag '$TAG'. Expected vX.Y.Z."
              exit 1
            fi
            if [[ "$PRERELEASE" == "true" ]]; then
              CHANNEL="nightly"
            else
              CHANNEL="stable"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

  source-tarball:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            blueprint-compiler \
            build-essential \
            curl \
            libadwaita-1-dev \
            libbz2-dev \
            libgtk-4-dev \
            libonig-dev \
            libxml2-utils \
            pandoc

      - name: Install Zig
        run: |
          ZIG_VERSION=$(sed -n -E 's/^[[:space:]]*\.?minimum_zig_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.zig.zon)
          curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-$(uname -m)-linux-${ZIG_VERSION}.tar.xz"
          sudo tar -xf /tmp/zig.tar.xz -C /opt
          sudo ln -sf "/opt/zig-$(uname -m)-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Build source tarball
        run: |
          rm -rf zig-out/dist
          zig build distcheck -Dversion-string=${{ needs.setup.outputs.version }} -fno-sys=gtk4-layer-shell
          cp "zig-out/dist/ghostty-${{ needs.setup.outputs.version }}.tar.gz" ghostty-source.tar.gz

      - name: Upload source tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: source-tarball
          path: ghostty-source.tar.gz

  linux-archive:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            blueprint-compiler \
            build-essential \
            curl \
            libadwaita-1-dev \
            libbz2-dev \
            libgtk-4-dev \
            libonig-dev \
            libxml2-utils \
            pandoc

      - name: Install Zig
        run: |
          ZIG_VERSION=$(sed -n -E 's/^[[:space:]]*\.?minimum_zig_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.zig.zon)
          curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-$(uname -m)-linux-${ZIG_VERSION}.tar.xz"
          sudo tar -xf /tmp/zig.tar.xz -C /opt
          sudo ln -sf "/opt/zig-$(uname -m)-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Build Linux release archive
        run: |
          zig build -Doptimize=ReleaseFast -Dcpu=baseline -Dversion-string=${{ needs.setup.outputs.version }} -fno-sys=gtk4-layer-shell
          tar --create --gzip --file ghostty-linux-x86_64.tar.gz --directory zig-out .

      - name: Upload Linux archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-archive
          path: ghostty-linux-x86_64.tar.gz

  macos-archive:
    needs: [setup]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Zig
        run: |
          ZIG_VERSION=$(sed -n -E 's/^[[:space:]]*\.?minimum_zig_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.zig.zon)
          case "$(uname -m)" in
            arm64) ZIG_ARCH="aarch64" ;;
            x86_64) ZIG_ARCH="x86_64" ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" && exit 1 ;;
          esac
          curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_ARCH}-macos-${ZIG_VERSION}.tar.xz"
          sudo tar -xf /tmp/zig.tar.xz -C /opt
          sudo ln -sf "/opt/zig-${ZIG_ARCH}-macos-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Verify macOS runner architecture
        run: |
          test "$(uname -m)" = "arm64"

      - name: Build macOS app
        run: |
          zig build -Doptimize=ReleaseFast -Dversion-string=${{ needs.setup.outputs.version }}
          test -d zig-out/Ghostty.app
          ditto -c -k --sequesterRsrc --keepParent zig-out/Ghostty.app ghostty-macos-arm64-unsigned.zip

      - name: Upload macOS archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-archive
          path: ghostty-macos-arm64-unsigned.zip

  flatpak-build:
    needs: [setup]
    runs-on: ubuntu-latest
    outputs:
      flatpak_branch: ${{ steps.branch.outputs.flatpak_branch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Select Flatpak branch
        id: branch
        shell: bash
        run: |
          if [[ "${{ needs.setup.outputs.channel }}" == "nightly" ]]; then
            echo "flatpak_branch=tip" >> "$GITHUB_OUTPUT"
          else
            echo "flatpak_branch=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak \
            flatpak-builder \
            ostree
          flatpak --version
          flatpak-builder --version

      - name: Configure Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle and repository
        shell: bash
        run: |
          BRANCH="${{ steps.branch.outputs.flatpak_branch }}"
          cd flatpak
          cp com.mitchellh.ghostty.yml community-manifest.yml
          sed -i "s/^default-branch:.*/default-branch: \"$BRANCH\"/" community-manifest.yml

          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo builddir community-manifest.yml
          flatpak build-bundle repo "../com.mitchellh.ghostty-${BRANCH}-x86_64.flatpak" com.mitchellh.ghostty "$BRANCH"
          flatpak build-update-repo --generate-static-deltas repo

      - name: Create Flatpak remote file
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          mkdir -p flatpak-pages
          cp -a flatpak/repo flatpak-pages/repo
          cat > flatpak-pages/ghostty-pixel-scroll.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Ghostty Pixel Scroll
          Comment=Ghostty Pixel Scroll Flatpak repository
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/flatpak-repo/repo
          Icon=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/images/icons/icon_512.png
          DefaultBranch=stable
          EOF

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flatpak
          path: |-
            com.mitchellh.ghostty-${{ steps.branch.outputs.flatpak_branch }}-x86_64.flatpak
            flatpak-pages

  flatpak-publish:
    needs: [flatpak-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Flatpak artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: flatpak

      - name: Publish Flatpak repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flatpak-pages
          destination_dir: flatpak-repo
          keep_files: true

  nix-cache:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Detect Cachix configuration
        id: cachix-guard
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE_NAME: ${{ secrets.CACHIX_CACHE_NAME }}
        shell: bash
        run: |
          if [[ -n "$CACHIX_AUTH_TOKEN" && -n "$CACHIX_CACHE_NAME" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cachix secrets missing; skipping cache push on ${{ matrix.runner }}."
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.cachix-guard.outputs.enabled == 'true' }}
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        if: ${{ steps.cachix-guard.outputs.enabled == 'true' }}
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        if: ${{ steps.cachix-guard.outputs.enabled == 'true' }}
        with:
          name: ${{ secrets.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build and push Nix package
        if: ${{ steps.cachix-guard.outputs.enabled == 'true' }}
        run: |
          nix build .#ghostty-releasefast
          nix path-info -r ./result | cachix push "${{ secrets.CACHIX_CACHE_NAME }}"

  release:
    needs: [setup, source-tarball, linux-archive, macos-archive, flatpak-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download source tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: source-tarball

      - name: Download Linux archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-archive

      - name: Download macOS archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-archive

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: flatpak

      - name: Generate checksums
        shell: bash
        run: |
          mkdir release
          mv ghostty-source.tar.gz release/
          mv ghostty-linux-x86_64.tar.gz release/
          mv ghostty-macos-arm64-unsigned.zip release/
          mv com.mitchellh.ghostty-*-x86_64.flatpak release/
          cp flatpak-pages/ghostty-pixel-scroll.flatpakrepo release/
          cd release
          shasum -a 256 * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Ghostty Pixel Scroll ${{ needs.setup.outputs.tag }}"
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release/ghostty-source.tar.gz
            release/ghostty-linux-x86_64.tar.gz
            release/ghostty-macos-arm64-unsigned.zip
            release/com.mitchellh.ghostty-*-x86_64.flatpak
            release/ghostty-pixel-scroll.flatpakrepo
            release/SHA256SUMS
